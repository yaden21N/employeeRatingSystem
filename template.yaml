AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Employee rating API — DynamoDB, Lambda, API Gateway, S3, CloudFront, Cognito

Globals:
  Function:
    Timeout: 10
    Runtime: python3.12

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-managers"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${AWS::StackName}-web"
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      PreventUserExistenceErrors: ENABLED

  AdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admins
      Description: Can approve manager requests
      UserPoolId: !Ref UserPool

  ManagersGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: managers
      Description: Can add and rate employees after an admin approves them
      UserPoolId: !Ref UserPool

  EmployeesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  RoleTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  EmployeeApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS

  EmployeeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda_function.lambda_handler
      CodeUri: lambda_src/
      Environment:
        Variables:
          TABLE_NAME: !Ref EmployeesTable
          ROLE_TABLE_NAME: !Ref RoleTable
          USER_POOL_ID: !Ref UserPool
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EmployeesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RoleTable
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminAddUserToGroup
              Resource: !GetAtt UserPool.Arn
      Events:
        ListEmployees:
          Type: HttpApi
          Properties:
            ApiId: !Ref EmployeeApi
            Path: /api/employees
            Method: GET
        AddEmployee:
          Type: HttpApi
          Properties:
            ApiId: !Ref EmployeeApi
            Path: /api/employees
            Method: POST
        GetEmployee:
          Type: HttpApi
          Properties:
            ApiId: !Ref EmployeeApi
            Path: /api/employees/{id}
            Method: GET
        EditEmployee:
          Type: HttpApi
          Properties:
            ApiId: !Ref EmployeeApi
            Path: /api/employees/{id}
            Method: PUT
        DeleteEmployee:
          Type: HttpApi
          Properties:
            ApiId: !Ref EmployeeApi
            Path: /api/employees/{id}
            Method: DELETE
        RateEmployee:
          Type: HttpApi
          Properties:
            ApiId: !Ref EmployeeApi
            Path: /api/employees/{id}/ratings
            Method: POST
        GetRole:
          Type: HttpApi
          Properties:
            ApiId: !Ref EmployeeApi
            Path: /api/role
            Method: GET
        ChooseRole:
          Type: HttpApi
          Properties:
            ApiId: !Ref EmployeeApi
            Path: /api/role
            Method: POST
        ListManagerRequests:
          Type: HttpApi
          Properties:
            ApiId: !Ref EmployeeApi
            Path: /api/manager-requests
            Method: GET
        ApproveManager:
          Type: HttpApi
          Properties:
            ApiId: !Ref EmployeeApi
            Path: /api/manager-requests/approve
            Method: POST

  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - HEAD
            AllowedOrigins:
              - "*"
            MaxAge: 3000

  WebBucketOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-web-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Employee rating web app
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_All
        Origins:
          - Id: WebS3Origin
            DomainName: !GetAtt WebBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt WebBucketOAC.Id
        DefaultCacheBehavior:
          TargetOriginId: WebS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}"

Outputs:
  ApiUrl:
    Description: Base URL for the API (same paths as server.py)
    Value: !Sub "https://${EmployeeApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  TableName:
    Description: DynamoDB table for employees
    Value: !Ref EmployeesTable
  WebBucketName:
    Description: S3 bucket for the web folder
    Value: !Ref WebBucket
  WebsiteUrl:
    Description: CloudFront URL for the web app
    Value: !Sub "https://${WebDistribution.DomainName}"
  CloudFrontDistributionId:
    Description: Use this to refresh the site after upload
    Value: !Ref WebDistribution
  UserPoolId:
    Description: Cognito user pool
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito app client for the web page
    Value: !Ref UserPoolClient
  CognitoRegion:
    Description: Region for cognito-idp calls from the browser
    Value: !Ref AWS::Region
